<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Аура · Карточка микса</title>
    <style>
      @page {
        size: 170mm 108mm;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1a1a1a;
        font-family: Montserrat, "Segoe UI", sans-serif;
        color: #f5f5f5;
      }
      .card {
        width: 170mm;
        height: 108mm;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(ellipse 85% 55% at 50% -5%, rgba(212, 120, 42, 0.42), transparent 60%),
          radial-gradient(ellipse 70% 45% at 78% 100%, rgba(212, 120, 42, 0.38), transparent 58%),
          #0b0b0b;
        border: 0.35mm solid rgba(180, 110, 50, 0.9);
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent calc(50% - 0.2mm),
          rgba(180, 110, 50, 0.85) 50%,
          transparent calc(50% + 0.2mm)
        );
      }
      .panel {
        position: relative;
        z-index: 1;
        padding: 7mm 8mm 6mm;
        display: flex;
        flex-direction: column;
      }
      .logo {
        text-align: center;
        margin-bottom: 4mm;
      }
      .logo .aura {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: lowercase;
      }
      .logo .hp {
        margin-top: 1mm;
        font-size: 6px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #d4782a;
      }
      .label {
        text-align: center;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #d4782a;
      }
      .line {
        margin: 2.5mm auto 0;
        width: 78%;
        border-bottom: 0.35mm solid #ecd2a0;
      }
      .qr {
        width: 30mm;
        height: 30mm;
        margin: 5mm auto 0;
        border: 0.35mm solid #ecd2a0;
        background: #161412;
        box-shadow: inset 0 0 0 1.5mm rgba(180, 110, 50, 0.35);
      }
      .tip {
        margin-top: 3.5mm;
        text-align: center;
        font-family: Literata, Georgia, serif;
        font-style: italic;
        font-size: 7px;
        color: #a8a8a8;
      }
      .meta {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4mm;
      }
      .meta .line {
        width: 90%;
      }
      .site {
        margin-top: 4mm;
        text-align: center;
        font-size: 6px;
        color: #d4782a;
      }
      .right-title {
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .right-sub {
        margin-top: 1.5mm;
        text-align: center;
        font-family: Literata, Georgia, serif;
        font-style: italic;
        font-size: 7px;
        color: #d4782a;
      }
      .right-rule {
        width: 70%;
        margin: 2.5mm auto 4mm;
        border-bottom: 0.25mm solid rgba(180, 110, 50, 0.8);
      }
      .mix-lines {
        display: grid;
        gap: 7.5mm;
        margin-top: 2mm;
      }
      .mix-row {
        display: flex;
        align-items: center;
        gap: 2.5mm;
      }
      .dot {
        width: 1.6mm;
        height: 1.6mm;
        border-radius: 50%;
        background: #d4782a;
        flex: 0 0 auto;
      }
      .mix-row .line {
        margin: 0;
        width: 100%;
      }
      .right-brand {
        margin-top: auto;
        text-align: center;
      }
      .right-brand .aura {
        font-size: 12px;
        font-weight: 700;
        text-transform: lowercase;
      }
      .right-brand .hp {
        margin-top: 1mm;
        font-size: 6px;
        letter-spacing: 0.42em;
        color: #d4782a;
      }
      .hint {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #888;
        font-size: 12px;
      }
      @media print {
        body {
          background: none;
        }
        .hint {
          display: none;
        }
        .card {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <section class="panel">
        <div class="logo">
          <div class="aura">aura</div>
          <div class="hp">HookahPlace</div>
        </div>
        <div class="label">Имя мастера</div>
        <div class="line"></div>
        <div class="qr" aria-label="Место под QR"></div>
        <div class="tip">Если понравился кальян — можете оставить чаевые</div>
        <div class="meta">
          <div>
            <div class="label">№ стола</div>
            <div class="line"></div>
          </div>
          <div>
            <div class="label">Время</div>
            <div class="line"></div>
          </div>
        </div>
        <div class="site">hpaura.ru</div>
      </section>
      <section class="panel">
        <div class="right-title">Кальянный микс</div>
        <div class="right-sub">Special · авторский микс Ауры</div>
        <div class="right-rule"></div>
        <div class="mix-lines">
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
          <div class="mix-row"><span class="dot"></span><div class="line"></div></div>
        </div>
        <div class="right-brand">
          <div class="aura">aura</div>
          <div class="hp">HookahPlace</div>
        </div>
      </section>
    </div>
    <p class="hint">Откроется в браузере · для печати: Ctrl/Cmd+P</p>
  </body>
</html>
